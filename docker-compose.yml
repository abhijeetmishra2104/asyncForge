version: '3.8'

services:
  # Local development runs its own Postgres. It used to borrow the hosted one,
  # which meant `docker compose up` wrote to the same database as the deployed
  # app, and left local work dependent on a cloud account staying alive.
  # Production now runs on Cloud SQL, which is private to the cluster and not
  # reachable from a laptop by design.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asyncforge
      POSTGRES_PASSWORD: password
      POSTGRES_DB: asyncforge
    ports:
      # 5433 on the host: 5432 is often already taken by another project's
      # Postgres. Inside the compose network the port is still 5432.
      - "5433:5432"
    volumes:
      - pgdata16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyncforge -d asyncforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: asyncforge
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rmqdata:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5

  migrate:
    build: .
    command: pnpm db:deploy
    environment:
      # Hardcoded on purpose. Compose also reads .env, so ${DATABASE_URL}
      # would pull in whatever the host uses — and a localhost URL does not
      # resolve inside a container anyway.
      DATABASE_URL: postgresql://asyncforge:password@postgres:5432/asyncforge
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://asyncforge:password@postgres:5432/asyncforge
      RABBITMQ_URL: amqp://asyncforge:password@rabbitmq:5672
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    environment:
      DATABASE_URL: postgresql://asyncforge:password@postgres:5432/asyncforge
      RABBITMQ_URL: amqp://asyncforge:password@rabbitmq:5672
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://asyncforge:password@postgres:5432/asyncforge
      RABBITMQ_URL: amqp://asyncforge:password@rabbitmq:5672
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  # pgdata16, not pgdata: an older pgdata volume exists on this machine,
  # initialised by Postgres 15, which 16 refuses to start against. The old
  # one is left alone rather than deleted.
  pgdata16:
  rmqdata: