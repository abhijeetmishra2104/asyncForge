apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  # A public IP costs ~$18/month for the forwarding rule — roughly half the
  # running cost of this whole deployment.
  #
  #   kubectl get svc web-service -n asyncforge -w
  #
  # Between demos, either delete this Service or change the type back to
  # ClusterIP and reach the app with:
  #   kubectl port-forward -n asyncforge svc/web-service 3000:80
  type: LoadBalancer

  # Only Cloudflare may reach the load balancer. Without this the origin IP
  # answers the public internet directly, so anyone who finds it skips the
  # edge entirely — TLS, caching, rate limiting and bot protection included.
  # Refresh from https://www.cloudflare.com/ips-v4 if Cloudflare adds ranges.
  loadBalancerSourceRanges:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22

  # Reserved in terraform as google_compute_address.web. Pinning it here means
  # a deleted-and-recreated Service (or a whole cluster rebuild) comes back on
  # the same address, so the DNS record for app.asyncforge.me keeps working.
  loadBalancerIP: 34.47.179.34
