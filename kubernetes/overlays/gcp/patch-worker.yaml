apiVersion: apps/v1
kind: Deployment
metadata:
  name: asyncforge-worker
spec:
  # Terminate the old pod before starting the new one. The default
  # RollingUpdate surges an extra pod, and with PREEMPTIBLE_CPUS quota at 0 on
  # a trial project no second Spot node can be created to hold it — the
  # rollout deadlocks with the old pod occupying the capacity the new one
  # needs. Recreate costs a few seconds of consumer downtime, which the queue
  # absorbs: unacked messages are simply redelivered.
  strategy:
    type: Recreate
    rollingUpdate: null

  # No replicas field: KEDA owns the count (kubernetes/autoscaling), scaling on
  # how many messages are waiting. Leaving it here would reset the worker count
  # on every deploy — including in the middle of draining a backlog.
  template:
    spec:
      # Prefer Spot, but do not require it. A nodeSelector is a hard
      # constraint: with PREEMPTIBLE_CPUS quota at 0 on a trial project, no new
      # Spot node can be created, so KEDA would scale to 5 and four pods would
      # sit Pending forever — which is exactly what happened the first time.
      # Preferred affinity keeps the cheap placement when Spot capacity exists
      # and falls back to regular nodes when it does not.
      #
      # A reclaimed worker is the failure this whole system was built to
      # survive: the RabbitMQ message is never ACKed, so another worker
      # picks the job back up.
      # The toleration must be explicit. Autopilot adds it automatically for a
      # gke-spot nodeSelector, but not for a preference — so dropping the
      # selector alone locked workers out of the Spot node entirely.
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values: ["true"]
      containers:
        - name: worker
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
