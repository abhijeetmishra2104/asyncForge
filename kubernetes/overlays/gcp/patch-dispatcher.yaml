apiVersion: apps/v1
kind: Deployment
metadata:
  name: asyncforge-dispatcher
spec:
  # One replica is a cost choice, not a correctness requirement. Dispatchers
  # claim the events they publish, so several can poll the same outbox without
  # publishing anything twice — tests/outbox.test.ts runs three side by side.
  #
  # Recreate is kept only because a surge pod may not fit: the trial project's
  # PREEMPTIBLE_CPUS quota is 0, so no extra Spot node can be created for it.
  strategy:
    type: Recreate
    rollingUpdate: null

  replicas: 1
  template:
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
        - name: dispatcher
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
