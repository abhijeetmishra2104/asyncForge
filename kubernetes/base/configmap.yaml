apiVersion: v1
kind: ConfigMap
metadata:
  name: asyncforge-config
  namespace: asyncforge
data:
  # Public demo limits. The Gemini free tier is the binding constraint, so
  # these are deliberately tight: per device for fairness, and a shared daily
  # ceiling so a burst of visitors cannot exhaust the quota for everyone else.
  ANALYZE_RATE_LIMIT: "3"
  DEVICE_REGISTER_RATE_LIMIT: "5"
  # Sized for a small prepaid balance rather than a daily free tier: on Opus 5
  # each job costs roughly two cents, so 40 a day keeps a $1 credit alive for
  # weeks. Raise it once the account has real budget.
  GLOBAL_ANALYZE_LIMIT: "40"

  # AI Model Configuration
  # Switching provider is a config change: set this to "gemini" and the worker
  # uses GEMINI_API_KEY instead. Both return the same validated shape.
  AI_PROVIDER: "claude"
  ANTHROPIC_MODEL: "claude-opus-5"
  GEMINI_MODEL: "gemini-3.6-flash"
  
  # RabbitMQ Configuration
  # Jobs are almost entirely spent waiting on Gemini, so one worker can hold
  # several at once. At 1, a second task queued behind a 10s model call waits
  # the full 10s before it even starts.
  RABBITMQ_PREFETCH: "4"
  # Set to "classic" if your broker rejects quorum queues (some managed
  # shared brokers do). Changing this requires deleting the existing
  # asyncforge.tasks.process queue, since queue type is immutable.
  RABBITMQ_QUEUE_TYPE: "quorum"
  
  # Outbox Pattern Configuration
  OUTBOX_POLL_INTERVAL_MS: "1000"
  OUTBOX_BATCH_SIZE: "20"
  # A claimed batch older than this belongs to a dispatcher that died mid-batch
  # and may be claimed again. Must comfortably exceed one batch's publish time.
  OUTBOX_CLAIM_TIMEOUT_MS: "30000"
  
  # Retry & Job Configuration
  MAX_JOB_ATTEMPTS: "3"
  RETRY_BASE_DELAY_MS: "1000"
  RETRY_MAX_DELAY_MS: "60000"
  JOB_PROCESSING_TIMEOUT_MS: "120000"
  GEMINI_TIMEOUT_MS: "45000"
  
  # Health Server Configuration
  WORKER_HEALTH_PORT: "8081"
  DISPATCHER_HEALTH_PORT: "8082"