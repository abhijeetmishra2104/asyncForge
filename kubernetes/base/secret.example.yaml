# Template for kubernetes/base/secret.yaml, which is intentionally NOT tracked
# in git because it holds live credentials.
#
# Before deploying:
#   cp kubernetes/base/secret.example.yaml kubernetes/base/secret.yaml
#   # then fill in the real values
#
# kustomization.yaml still references secret.yaml, so the copy must exist for
# `kubectl apply -k` to work.
apiVersion: v1
kind: Secret
metadata:
  name: asyncforge-secrets
  namespace: asyncforge
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST/DATABASE?sslmode=require&channel_binding=require"
  RABBITMQ_URL: "amqp://USER:PASSWORD@rabbitmq:5672"
  RABBITMQ_DEFAULT_USER: "asyncforge"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
