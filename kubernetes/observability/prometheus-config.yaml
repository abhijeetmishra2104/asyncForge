apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq-service:15692']
      
      - job_name: 'asyncforge-web'
        metrics_path: '/api/metrics'
        static_configs:
          - targets: ['web-service:80']
      
      - job_name: 'asyncforge-dispatcher'
        dns_sd_configs:
          - names: ['dispatcher-service.asyncforge.svc.cluster.local']
            type: A
            port: 8082
      
      - job_name: 'asyncforge-worker'
        dns_sd_configs: # Dynamically discovers all 3 worker replicas!
          - names: ['worker-service.asyncforge.svc.cluster.local']
            type: A
            port: 8081