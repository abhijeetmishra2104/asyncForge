apiVersion: v1
kind: Service
metadata:
  name: dispatcher-service
spec:
  clusterIP: None # "None" makes it headless
  selector:
    app: dispatcher
  ports:
    - name: metrics
      port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
spec:
  clusterIP: None 
  selector:
    app: worker
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081