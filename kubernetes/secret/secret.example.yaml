# Template for kubernetes/secret/secret.yaml, which is intentionally NOT tracked
# in git because it holds live credentials.
#
# Before deploying:
#   cp kubernetes/secret/secret.example.yaml kubernetes/secret/secret.yaml
#   # then fill in the real values
#
# Only overlays/local includes this directory. The GCP overlay deliberately
# does not: its Secret is created by the deploy workflow from GitHub Actions
# secrets, so a local `kubectl apply -k overlays/gcp` cannot overwrite the
# live credentials with dev ones.
apiVersion: v1
kind: Secret
metadata:
  name: asyncforge-secrets
  namespace: asyncforge
type: Opaque
stringData:
  # Production comes from `terraform output database_url` (Cloud SQL, private IP).
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DATABASE?connection_limit=5"
  RABBITMQ_URL: "amqp://USER:PASSWORD@rabbitmq:5672"
  RABBITMQ_DEFAULT_USER: "asyncforge"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  # Only the active provider's key is required (see AI_PROVIDER in the ConfigMap).
  ANTHROPIC_API_KEY: "YOUR_ANTHROPIC_API_KEY"
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
