apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
            - containerPort: 15692 # <-- NEW: Prometheus metrics port
              name: metrics
          envFrom:
            - secretRef:
                name: asyncforge-secrets
          volumeMounts:
            - name: plugins-config # <-- NEW: Mount the config map
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
      volumes:
        - name: plugins-config # <-- NEW: Define the volume
          configMap:
            name: rabbitmq-plugins